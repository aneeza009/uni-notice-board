name: CI Pipeline

on:
  push:
    branches:
      - develop

jobs:

  lint-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx htmlhint src/

  lint-css:
    runs-on: ubuntu-latest
    needs: lint-html   
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx stylelint "styles/**/*.css"

  build:
    runs-on: ubuntu-latest
    needs: lint-css  
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: echo "Build step passed (static project)"   # ✅ prevents error

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t notice-board .

  docker-push:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/notice-board:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/notice-board:latest